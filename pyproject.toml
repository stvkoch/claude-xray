[project]
name = "claude-xray"
version = "0.1.0"
description = "Live X-ray of a Claude Code session in your terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=8"]

[project.urls]
Homepage = "https://github.com/stvkoch/claude-xray"

[project.scripts]
claude-xray = "claude_xray:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["claude_xray.py"]
